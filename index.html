<!DOCTYPE html>
<html>
<head>
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="body">
    <div>
    <h1>🌤️ Weather App</h1>
      <form>
    <h2>What's the weather like today? 🌦️</h2>

    <input
        type="text"
        id="cityInput"
        placeholder="Enter city name"
    >

    <button
        type="button"
        id="getWeatherBtn"
        class="getWeatherBtn"
    >
        Get Weather
    </button>

    <p id="answer">
        The weather information will appear here.
    </p>
    </form>
    </div>
    <script src="script.js"></script>
   </body>
</html>
